                <p class="sub">Vos coordonnées et votre mot de passe.</p>
            </div>
            <div class="app-actions">
                <div class="who">
                    <span class="who-av" id="whoAvatar" aria-hidden="true">–</span>
                    <div>
                        <p class="who-nom" id="whoNom">Administration IDC</p>
                        <p class="who-mail" id="whoMail"></p>
                    </div>
                </div>
            </div>
        </div>

        <section class="panel">
            <div class="panel-head"><h2>Coordonnées</h2></div>
            <div class="filters-grid">
                <div class="filters"><label for="p-nom">Nom</label><input class="input" id="p-nom" type="text" value="Adama Keita"></div>
                <div class="filters"><label for="p-mail">Adresse électronique</label><input class="input" id="p-mail" type="email" value="info@idc-ci.com"></div>
                <div class="filters"><label for="p-tel">Téléphone</label><input class="input" id="p-tel" type="tel" value="+225 27 21 25 87 70"></div>
                <div class="filters"><label for="p-role">Rôle</label><input class="input" id="p-role" type="text" value="Gestionnaire" readonly></div>
            </div>
            <p style="margin-top:20px"><button class="btn btn--sm" type="button">Enregistrer <span class="ar" aria-hidden="true">&rarr;</span></button></p>
        </section>

        <section class="panel">
            <div class="panel-head"><h2>Changer le mot de passe</h2></div>
            <div class="filters-grid">
                <div class="filters"><label for="p-actuel">Mot de passe actuel</label><input class="input" id="p-actuel" type="password" autocomplete="current-password"></div>
                <div class="filters"><label for="p-neuf">Nouveau mot de passe</label><input class="input" id="p-neuf" type="password" autocomplete="new-password"></div>
                <div class="filters"><label for="p-conf">Confirmer</label><input class="input" id="p-conf" type="password" autocomplete="new-password"></div>
            </div>
            <p style="margin-top:20px"><button class="btn btn--sm" type="button">Changer le mot de passe <span class="ar" aria-hidden="true">&rarr;</span></button></p>
        </section>

    </main>
</div>

<script>
(function () {
    'use strict';

    // Session posée par login.html. La clé était « loggedInUser » côté
    // espace client et « idc-session » côté connexion : personne n'était
    // jamais reconnu.
    var brut = null;
    try { brut = localStorage.getItem('idc-session'); } catch (e) { /* stockage bloqué */ }

    if (!brut) {
        window.location.replace('login.html');
        return;
    }

    var session = {};
    try { session = JSON.parse(brut) || {}; } catch (e) { session = {}; }

    var nom  = session.nom || 'Administration IDC';
    var mail = session.email || '';

    var elNom = document.getElementById('whoNom');
    var elMail = document.getElementById('whoMail');
    var elAv  = document.getElementById('whoAvatar');
    if (elNom) { elNom.textContent = nom; }
    if (elMail) { elMail.textContent = mail; }
    if (elAv) {
        elAv.textContent = nom.split(/\s+/).map(function (m) { return m.charAt(0); })
                              .join('').toUpperCase().slice(0, 2);
    }

    var sortie = document.getElementById('deconnexion');
    if (sortie) {
        sortie.addEventListener('click', function () {
            try { localStorage.removeItem('idc-session'); } catch (e) { /* rien */ }
            window.location.href = 'login.html';
        });
    }
})();
</script>
