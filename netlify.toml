[build]
  command = "node build.js"
  publish = "public"

# Pas de redirection attrape-tout ici : c'est une règle d'application à page
# unique. Sur un site multipage elle renvoie l'accueil avec un code 200 pour
# toute adresse inconnue — un « faux 404 » que les moteurs indexent comme une
# page valide. Netlify sert 404.html de lui-même quand aucun fichier ne
# correspond, ce qui est le comportement attendu.

[context.production.environment]
  # build.js emploie fs.readdirSync({ recursive: true }), apparu en 18.17 :
  # « 18 » laisse Netlify choisir dans la branche 18.x, et une version
  # antérieure ignorerait l'option en silence au lieu d'échouer. Node 20 est
  # la version LTS courante et lève le doute.
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
