[build]
  command = "node build.js"
  publish = "public"

# Pas de redirection attrape-tout ici : c'est une règle d'application à page
# unique. Sur un site multipage elle renvoie l'accueil avec un code 200 pour
# toute adresse inconnue — un « faux 404 » que les moteurs indexent comme une
# page valide. Netlify sert 404.html de lui-même quand aucun fichier ne
# correspond, ce qui est le comportement attendu.

[build.environment]
  # build.js emploie fs.readdirSync({ recursive: true }), apparu en 18.17 :
  # « 18 » laisse Netlify choisir dans la branche 18.x, et une version
  # antérieure ignorerait l'option en silence — le site partirait amputé de
  # ses images sans que la construction échoue. Node 20 lève le doute.
  #
  # Déclaré ici et non sous [context.production.environment] : ce dernier ne
  # s'applique qu'à la branche de production. Les déploiements de branche —
  # refonte-v2 aujourd'hui — n'en héritent pas et retomberaient sur la
  # version par défaut de Netlify.
  NODE_VERSION = "20"

# Un an de cache, et « immutable » pour éviter jusqu'à la revalidation.
# Ce n'est sûr que parce que build.js appose une empreinte de contenu sur
# chaque image publiée : une image modifiée change de nom, donc d'adresse,
# et personne ne peut se voir servir l'ancienne. Sans cette empreinte, la
# règle ci-dessous gelait pour un an toute image remplacée sous le même nom.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pas de règle pour le HTML : le défaut de Netlify est
# « public, max-age=0, must-revalidate », exactement ce qu'il faut. La page
# est servie depuis le cache après un 304, mais jamais sans demander.
#
# La règle précédente, for = "/*.html", donnait une heure de cache sec — et
# ne s'appliquait qu'aux adresses finissant par .html : « /eshop » y
# échappait, « /eshop.html » non. Deux visiteurs de la même page pouvaient
# voir deux versions différentes.
